name: Static functional checks (F0)

# Offline checks against microsoft/discovery main. No Azure access and no secrets:
# the catalog is parsed, never executed.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      catalog_ref:
        description: "microsoft/discovery ref to check (branch, tag, SHA or refs/pull/N/head)"
        default: main
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check out the catalog (data only)
        uses: actions/checkout@v4
        with:
          repository: microsoft/discovery
          ref: ${{ inputs.catalog_ref || 'main' }}
          path: catalog
          lfs: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: dft static
        id: static
        run: |
          set +e
          dft static --catalog catalog --out out
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat out/static-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Compare with the accepted baseline
        if: hashFiles('baselines/static.json') != ''
        run: |
          set +e
          dft diff baselines/static.json out/static-results.json --out out/static-diff.md
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat out/static-diff.md >> "$GITHUB_STEP_SUMMARY"
        id: diff

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dft-static-${{ github.run_id }}
          path: out/

      # Fail only on regressions against the baseline, so known issues don't keep the job red.
      - name: Verdict
        run: |
          if [ "${{ steps.diff.outputs.rc || steps.static.outputs.rc }}" != "0" ]; then
            echo "::error::New static errors since the baseline. See the job summary."; exit 1; fi
